<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 448" width="320" height="448" role="img" aria-label="Card art coming soon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161028"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#9b5ffa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9b5ffa" stop-opacity="0"/>
    </radialGradient>
