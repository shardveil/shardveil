  <rect width="320" height="448" fill="url(#bg)"/>
  <rect width="320" height="448" fill="url(#glow)"/>
  <rect x="8" y="8" width="304" height="432" rx="12" fill="none" stroke="#2a2a4a" stroke-width="1.5"/>

